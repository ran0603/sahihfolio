name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sahihfolio_preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sahihfolio_preview
      RESEND_API_KEY: test-api-key
      EMAIL_FROM: "Sahihfolio <results@sahihfolio.com>"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Check PostgreSQL connectivity
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            "postgresql://postgres:postgres@localhost:5432/sahihfolio_preview" \
            -c "SELECT version();"

      - name: Apply database migrations
        run: pnpm --filter @sahihfolio/database db:migrate

      - name: Build web application preview
        run: pnpm --filter @sahihfolio/web build